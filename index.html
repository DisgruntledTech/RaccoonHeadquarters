<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Raccoon Headquarters</title>
	<style>
		body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; margin:0}
		header{background:#222;color:#fff;padding:12px 16px}
		nav a{color:#fff;margin-right:12px;text-decoration:none}
		main{padding:16px}
	</style>
</head>
<body>
	<header>
		<strong>Raccoon Headquarters</strong>
		<nav>
			<a href="#/">Home</a>
			<a href="#/about">About</a>
			<a href="#/contact">Contact</a>
		</nav>
	</header>

	<main>
		<!-- Single Page App content container -->
		<div id="app" aria-live="polite">
			Loading...
		</div>
	</main>

	<script>
		// Simple hash-based router that fetches fragment HTML files (e.g. /pages/about.html)
		const app = document.getElementById('app');

		async function loadRoute() {
			const hash = location.hash.replace(/^#/, '') || '/';
			// Map route to file under /pages for fetch. Root maps to /pages/home.html
			const route = (hash === '/' || hash === '') ? 'home' : hash.replace(/^\//, '');
			const url = `pages/${route}.html`;
			try {
				const res = await fetch(url, {cache: 'no-store'});
				if (!res.ok) throw new Error('Not found');
				app.innerHTML = await res.text();
			} catch (e) {
				app.innerHTML = `<h2>Page not found</h2><p>Could not load ${route}.</p>`;
			}
		}

		window.addEventListener('hashchange', loadRoute);
		window.addEventListener('load', loadRoute);
	</script>
</body>
</html>
